# Force light theme regardless of the user's Windows/macOS dark preference.
# Reason: the CIVIS custom CSS in src/civis/web/theme.py assumes light-mode
# surfaces (white bubble backgrounds, near-black text). Without this file the
# app inherits system dark mode → white text on white bubbles → invisible.

[theme]
base = "light"
primaryColor = "#1f4b8f"
backgroundColor = "#fafaf7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c2530"
font = "sans serif"

[server]
# Streamlit sometimes tries to auto-open the browser twice on Windows;
# disabling gives the launcher (run.bat) full control.
headless = false
