# CIVIS configuration — lightweight Ollama models for slow / no-GPU hardware.
#
# When to use this setup:
#   - The default 7B persona + 8B judge combo is too slow on your machine
#     (>60s per turn) and the demo feels unusable.
#   - You want to iterate on prompts / UI without waiting for a big model.
#
# Trade-off: smaller models produce lower-quality persona speech and
# rubric reasoning. Fine for dev + demo, NOT for the M1-A study — always
# fall back to the default or Claude-judge setup before generating
# session data that will feed the kappa report.
#
# Requirements:
#   - Pull the smaller models first:
#       ollama pull qwen2.5:3b-instruct-q4_K_M
#       ollama pull llama3.2:3b-instruct-q4_K_M
#   - Copy to your user config file (%APPDATA%\civis\config.toml on
#     Windows, $XDG_CONFIG_HOME/civis/config.toml on Linux/Mac).

[models.persona_light]
provider = "ollama"
model_id = "qwen2.5:3b-instruct-q4_K_M"
base_url = "http://localhost:11434"
request_timeout_s = 60.0

[models.judge_light]
provider = "ollama"
model_id = "llama3.2:3b-instruct-q4_K_M"
base_url = "http://localhost:11434"
request_timeout_s = 60.0

[roles]
persona = "persona_light"
judge = "judge_light"
