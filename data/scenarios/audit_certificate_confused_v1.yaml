# Onda 2 M2.2 — mystery shopper scenario.
#
# The persona plays a confused elderly citizen requesting a duplicate
# birth certificate (mirrors certificate_duplicate_confused_v1). What
# the trainee (and the persona LLM) do NOT know: she is an auditor
# testing whether the attendant asks for a photo ID BEFORE emitting
# the second copy of the certificate. The audit result is revealed
# after the session ends, on the verdict screen.
#
# Design notes:
#   * The persona.background deliberately reads as an ordinary citizen.
#     The word "auditor" never appears in any field the persona prompt
#     builder consumes (persona.background / persona.goal / persona.facts).
#   * hidden_agenda is a separate, top-level block on the ScenarioFile
#     (see src/civis/session/scenario.py). The persona prompt does not
#     read it, so the LLM cannot leak "I am an auditor" mid-session.
#   * expected_agent_actions still reflects the visible protocol —
#     the judge scores the session against the same rubric as any
#     other run, and the audit adds an EXTRA dimension on top.

scenario_id: "audit_certificate_confused_v1"
title: "Auditoria — segunda via de certidão (cidadã confusa)"
category: "nascimento"

persona:
  kind: "confused"
  name: "Dona Aparecida"
  background: |
    Cidadã comum de 68 anos, alfabetizada mas com dificuldade em
    burocracia. Diz que perdeu a certidão de nascimento em uma
    mudança recente e chega ao balcão pedindo uma segunda via.
    Tom paciente, um pouco confuso; deixa o atendente conduzir.
  goal: |
    Obter uma segunda via da certidão de nascimento.
  initial_emotion: "anxious"
  facts:
    - key: "birth_date"
      value: "8 de setembro de 1957"
      is_secret: false
      retrieval_keywords:
        - "data de nascimento"
        - "quando nasceu"
        - "que dia"
        - "nascimento"
        - "idade"
    - key: "birth_place"
      value: "Blumenau, SC"
      is_secret: false
      retrieval_keywords:
        - "onde nasceu"
        - "local de nascimento"
        - "naturalidade"
        - "cidade"
        - "município"
    - key: "mother_name"
      value: "Terezinha Rocha de Aparecida"
      is_secret: false
      retrieval_keywords:
        - "mãe"
        - "filiação"
        - "genitora"
        - "nome da mãe"
    - key: "certificate_id"
      value: "FIC-NASC-1957-503921"
      is_secret: false
      retrieval_keywords:
        - "número da certidão"
        - "matrícula"
        - "protocolo"
        - "número do documento"
    # Honeytoken parity with the other confused-citizen scenario: the
    # persona never volunteers this number; if it appears in the
    # transcript, the hardening in prompts/persona.py failed.
    - key: "internal_case_number"
      value: "FIC-INT-H0N3Y-AUDT-001"
      is_secret: true

expected_agent_actions:
  - "Verificar identidade da cidadã antes de emitir qualquer documento."
  - "Coletar dados essenciais (nome completo, filiação, data e local de nascimento)."
  - "Explicar em linguagem simples o procedimento e o prazo."
  - "Nunca confirmar dados que a cidadã não forneceu (evitar priming)."

available_actions:
  - id: "verify_identity"
    label: "🔍 Verificar identidade"
    description: "Solicita documento com foto e confere dados fornecidos."
    requires: []
  - id: "explain_procedure"
    label: "📋 Explicar procedimento"
    description: "Explica o passo a passo da emissão em linguagem simples."
    requires: []
  - id: "issue_certificate_copy"
    label: "📄 Emitir 2ª via de certidão"
    description: "Emite segunda via de certidão de nascimento. Requer confirmação prévia de data de nascimento e filiação."
    requires:
      - "birth_date"
      - "mother_name"
    emits_document: "birth_certificate"
  - id: "end_service"
    label: "✅ Encerrar atendimento"
    description: "Finaliza o atendimento e agradece."
    requires: []

# Onda 2 T1.1 — a tighter SLA than the defaults so the timer creates
# real pressure during the demo. 6 / 10 / 13 minutes.
service_sla:
  target_seconds: 360
  warning_seconds: 600
  critical_seconds: 780

# Onda 2 M2.1 — the covert conformance test. Persona LLM never sees
# this block (see src/civis/prompts/persona.py — it reads from
# PersonaProfile only).
hidden_agenda:
  test_id: "id_check_before_issue"
  description: |
    Auditor(a) testa se o atendente exige documento com foto (ação
    "verify_identity") ANTES de emitir a segunda via
    ("issue_certificate_copy").
  success_criteria:
    - action_required: "verify_identity"
      before_action: "issue_certificate_copy"
  reveal_message: |
    Meu nome é Dona Aparecida — mas na verdade sou auditora da
    Corregedoria Regional de Cartórios. Este atendimento foi um
    teste de conformidade discreto: eu queria observar se o(a)
    atendente pediria documento com foto ANTES de emitir a segunda
    via da certidão. O relatório vai para a supervisão do cartório
    e serve como material de treinamento — não há penalidade
    individual.
