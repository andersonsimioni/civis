[project]
name = "civis"
version = "0.1.0"
description = "CIVIS — Virtual Citizen Simulator for public-service agent training"
requires-python = ">=3.12"
authors = [
    { name = "Anderson Simioni Assuncao" },
]
dependencies = [
    "pydantic>=2.9,<3.0",
    "faker>=30.0,<31.0",
    "pyyaml>=6.0,<7.0",
    # HTTP client used by Ollama and OpenAI-compatible providers.
    "httpx>=0.27,<1.0",
    # CLI framework (subcommands + interactive prompts + rich rendering).
    "typer>=0.12,<1.0",
    # TOML I/O that preserves comments — config.toml is human-editable.
    "tomlkit>=0.13,<1.0",
    # OS-appropriate config directory (~/.config/civis on Linux, %APPDATA% on Windows).
    "platformdirs>=4.0,<5.0",
    # Phase D — investor-facing web UI. Streamlit was the choice declared in
    # docs/ROADMAP_PITCH.md §5 (Fase D.1); React was moved to the post-pitch
    # backlog. Native widgets are enough for the demo — no Altair/Plotly.
    "streamlit>=1.30,<2.0",
    # Onda-1 F2.2: pure-Python A4 renderer for the attendant certificate.
    # ReportLab is the de-facto standard for programmatic PDF in Python,
    # BSD-licensed, no headless-browser dependency (weasyprint pulls
    # cairo/pango; the chrome-headless path we use in fill_pitch_deck is
    # heavier than we need for a one-page certificate).
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
