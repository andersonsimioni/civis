[project]
name = "civis"
version = "0.1.0"
description = "CIVIS — Virtual Citizen Simulator for public-service agent training"
requires-python = ">=3.12"
authors = [
    { name = "Anderson Simioni Assuncao" },
]
dependencies = [
    "pydantic>=2.9,<3.0",
    "faker>=30.0,<31.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
